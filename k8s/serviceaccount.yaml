# KSA bindeada por Workload Identity al GSA read-only obs-backend (creado en Fase 0).
# El binding iam.workloadIdentityUser ya existe:
#   serviceAccount:itmind-macro-auto-0.svc.id.goog[observability/obs-backend] -> obs-backend@itmind-macro-auto-0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-backend
  namespace: observability
  annotations:
    iam.gke.io/gcp-service-account: obs-backend@itmind-macro-auto-0.iam.gserviceaccount.com
