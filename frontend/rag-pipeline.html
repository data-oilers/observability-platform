<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Pipeline Explorer — Banco Macro</title>
<style>
/* ============ Mesa de Operaciones — tokens ============ */
:root{
  --bg:#0B0E14; --bg-grid:#161C26;
  --panel:#121826; --panel-2:#171F2E; --panel-3:#1C2433;
  --line:#26303F; --line-2:#1B2330;
  --tx:#E8EDF4; --tx-2:#97A3B4; --tx-3:#5E6A7A;
  --c-graph:#3FBFAE; --c-router:#E8A33D; --c-usecase:#5B8DD9;
  --c-infra:#C2738F; --c-helper:#8FA35C; --c-dead:#4A5260; --c-dead-tx:#6B7585;
  --hov:#F0B254; --sel:#FFD27D; --rec:#FF9447;
  --ok:#46C28A; --warn:#D9822B; --err:#E5534B;
  --edge:#5E6A7A; --edge-usa:#7A6470;
  --node-fill:#131A28; --chip-bg:#0E1420;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#EEF1F6; --bg-grid:#DDE3EC;
  --panel:#FFFFFF; --panel-2:#F7F9FC; --panel-3:#EDF1F7;
  --line:#C9D2DF; --line-2:#D8DFE9;
  --tx:#15202E; --tx-2:#46556A; --tx-3:#7C8A9D;
  --c-graph:#0E8D7D; --c-router:#B27512; --c-usecase:#2F66B5;
  --c-infra:#A04E6E; --c-helper:#5F7634; --c-dead:#9AA4B1; --c-dead-tx:#7C8794;
  --hov:#B96F0A; --sel:#9A5C00; --rec:#D6620E;
  --ok:#178655; --warn:#A85F12; --err:#C03B33;
  --edge:#8C99AB; --edge-usa:#A88C99;
  --node-fill:#FFFFFF; --chip-bg:#F1F4F9;
  --shadow:0 8px 28px rgba(30,45,70,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px;
  display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::selection{background:rgba(240,178,84,.3)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ============ Header ============ */
header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;z-index:40;position:relative}
.brand{display:flex;flex-direction:column;gap:1px;min-width:265px}
.brand h1{font:600 13.5px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.brand h1 .bm{color:var(--c-router)}
.brand .sub{font:400 10px/1.2 var(--mono);color:var(--tx-3);white-space:nowrap}
.counters{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--chip-bg)}
.counter{display:flex;flex-direction:column;align-items:center;padding:5px 12px 4px;border-right:1px solid var(--line);cursor:default}
.counter:last-child{border-right:none}
.counter b{font:600 16px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.counter span{font:400 8.5px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3);white-space:nowrap}
.counter b.tealc{color:var(--c-graph)} .counter b.warnc{color:var(--warn)} .counter b.deadc{color:var(--c-dead-tx)}
.hspace{flex:1}
.searchbox{position:relative}
.searchbox input{background:var(--chip-bg);border:1px solid var(--line);border-radius:4px;color:var(--tx);
  font:400 12px var(--mono);padding:7px 10px 7px 28px;width:240px;outline:none;transition:border-color .15s}
.searchbox input:focus{border-color:var(--hov)}
.searchbox .sicon{position:absolute;left:9px;top:8px;color:var(--tx-3);pointer-events:none;font-size:12px}
.sresults{position:absolute;top:36px;left:0;width:330px;max-height:320px;overflow-y:auto;background:var(--panel-2);
  border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:none;z-index:60}
.sresults.open{display:block}
.sresults .ri{padding:7px 10px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;align-items:center;gap:8px}
.sresults .ri:hover,.sresults .ri.act{background:var(--panel-3)}
.sresults .ri .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.sresults .ri .rid{font:500 11.5px var(--mono)}
.sresults .ri .rl{font:400 10.5px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--line);border-radius:4px;padding:7px 11px;font:500 11px var(--sans);
  letter-spacing:.03em;color:var(--tx-2);background:var(--chip-bg);transition:all .15s;white-space:nowrap}
.hbtn:hover{color:var(--tx);border-color:var(--tx-3)}
.hbtn.on{color:var(--hov);border-color:var(--hov)}

/* ============ Filter bar ============ */
.fbar{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px;padding:6px 16px;flex-wrap:wrap;z-index:39;position:relative}
.flabel{font:500 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;
  padding:4px 9px;font:500 10.5px var(--sans);color:var(--tx-2);background:var(--chip-bg);transition:all .15s}
.fchip .sw{width:9px;height:9px;border-radius:2px}
.fchip:hover{border-color:var(--tx-3);color:var(--tx)}
.fchip.off{opacity:.38}
.fchip.special.on{border-color:var(--hov);color:var(--hov)}
.fsep{width:1px;height:18px;background:var(--line);margin:0 4px}

/* ============ Layout main ============ */
#main{flex:1 1 auto;position:relative;overflow:hidden}
#canvasWrap{position:absolute;inset:0;cursor:grab;background:var(--bg)}
#canvasWrap.panning{cursor:grabbing}
#canvasWrap.scenario-on{cursor:default}
svg{display:block;width:100%;height:100%}
svg text{user-select:none;-webkit-user-select:none}

/* zones */
.zone-rect{fill:none;stroke:var(--line-2);stroke-width:1;rx:6}
.zone-title{font:600 11px var(--sans);letter-spacing:.14em;fill:var(--tx-3);text-transform:uppercase}
.zone-grafo-rect{fill:rgba(63,191,174,.025);stroke:var(--c-graph);stroke-width:1.5;stroke-opacity:.55}
.zone-grafo-tab{fill:var(--panel-2);stroke:var(--c-graph);stroke-opacity:.55;stroke-width:1.5}
.zone-grafo-title{font:600 11px var(--sans);letter-spacing:.12em;fill:var(--c-graph)}
.zone-grafo-note{font:500 10.5px var(--sans);fill:var(--c-router)}
.zone-muerto-rect{fill:none;stroke:var(--c-dead);stroke-width:1.2;stroke-dasharray:6 4}
.cajetin{fill:var(--panel);stroke:var(--line);stroke-width:1}
.cajetin-t{font:500 9px var(--mono);fill:var(--tx-3)}
.cajetin-v{font:500 10px var(--mono);fill:var(--tx-2)}

/* nodes */
.node{cursor:pointer}
.node .shape{fill:var(--node-fill);stroke-width:1.25;transition:opacity .14s,stroke .14s,filter .14s}
.node .accent{transition:opacity .14s}
.node .nid{font:500 12px var(--mono);fill:var(--tx)}
.node .ndesc{font:400 10px var(--sans);fill:var(--tx-2)}
.node .ntag{font:600 8px var(--mono);letter-spacing:.08em;fill:var(--tx-3)}
.node:hover .shape{stroke-width:2}
.node.selected .shape{stroke:var(--sel);stroke-width:2;filter:drop-shadow(0 0 6px rgba(255,210,125,.35))}
.node.dead-node .nid,.node.dead-node .ndesc{opacity:.55}
.node.dead-node .shape{stroke-dasharray:4 3}
.badge{font:500 9px var(--mono)}
.badge-bg{rx:2}
.flagoff-tag{font:600 8.5px var(--mono);fill:var(--warn)}
.dead-tag{font:600 8.5px var(--mono);letter-spacing:.06em;fill:var(--c-dead-tx)}

/* edges */
.edge path.main{fill:none;stroke:var(--edge);stroke-width:1.5;transition:stroke .14s,opacity .14s,stroke-width .14s}
.edge path.hit{fill:none;stroke:transparent;stroke-width:12}
.edge.spine path.main{stroke-width:2}
.edge.kind-usa path.main{stroke:var(--edge-usa);stroke-width:1;stroke-dasharray:2 4}
.edge.kind-bg path.main{stroke-dasharray:1 4}
.edge.kind-bypass path.main{stroke-dasharray:7 5;stroke-width:1.3}
.edge.kind-cond-off path.main{stroke-dasharray:5 4;stroke:var(--warn);stroke-opacity:.7}
.edge.kind-loop path.main{stroke:var(--c-router);stroke-opacity:.8;stroke-width:1.8}
.edge .ah{transition:fill .14s,opacity .14s}
.edge.hl path.main{stroke:var(--hov)!important;stroke-width:2.4!important;stroke-opacity:1!important}
.edge.hl .ah{fill:var(--hov)!important}
.edge.rec path.main{stroke:var(--rec)!important;stroke-width:2.6!important;stroke-opacity:1!important;stroke-dasharray:none}
.edge.rec .ah{fill:var(--rec)!important}
.edge.rec-cur path.main{stroke-dasharray:9 6!important;animation:flow 0.9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.usa-hidden .edge.kind-usa{display:none}
.usa-hidden .edge.kind-usa.force-show{display:inline}

/* chips de edge */
.echip{cursor:default}
.echip rect{fill:var(--chip-bg);stroke:var(--line);stroke-width:1;rx:2;transition:stroke .14s,opacity .14s}
.echip text{font:500 10px var(--mono);fill:var(--tx-2);transition:fill .14s}
.echip.rule rect{stroke:var(--c-router);stroke-opacity:.65}
.echip.rule text{fill:var(--c-router)}
.echip.chip-off rect{stroke-dasharray:3 2;stroke:var(--warn)}
.echip.chip-off text{fill:var(--warn)}
.echip.hl rect{stroke:var(--hov);stroke-opacity:1}
.echip.hl text{fill:var(--hov)}
.echip.rec rect{stroke:var(--rec)} .echip.rec text{fill:var(--rec)}
.loopbadge rect{fill:var(--chip-bg);stroke:var(--c-router);stroke-width:1.2;rx:3}
.loopbadge text{font:600 10.5px var(--mono);fill:var(--c-router)}

/* bus */
.bus-rail{stroke:var(--edge);stroke-width:3;stroke-opacity:.5;fill:none}
.bus-label{font:600 10px var(--mono);letter-spacing:.1em;fill:var(--tx-3)}
.pasamuros{fill:var(--bg);stroke:var(--c-router);stroke-width:1.5}
.callout rect{fill:var(--panel-2);stroke:var(--c-router);stroke-width:1;rx:4}
.callout text{font:500 10.5px var(--sans);fill:var(--tx-2)}
.callout .ct{font:600 10.5px var(--sans);fill:var(--c-router)}
.callout line{stroke:var(--c-router);stroke-width:1;stroke-dasharray:3 3}

/* dimming global (hover y recorrido) */
#viewport.dim .node,#viewport.dim .edge,#viewport.dim .echip,#viewport.dim .loopbadge{opacity:.16}
#viewport.dim .zonelayer{opacity:.45}
#viewport.dim .node.hl,#viewport.dim .node.selected,#viewport.dim .node.rec{opacity:1}
#viewport.dim .edge.hl,#viewport.dim .edge.rec,#viewport.dim .echip.hl,#viewport.dim .echip.rec{opacity:1}
#viewport.dim .node.rec-cur{opacity:1}
.node.rec .shape{stroke:var(--rec)}
.node.rec-cur .shape{stroke:var(--rec);stroke-width:2.5;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(255,148,71,.25))}50%{filter:drop-shadow(0 0 12px rgba(255,148,71,.75))}}
/* filtros */
.node.fdim,.edge.fdim{opacity:.12;pointer-events:none}
.echip.fdim{opacity:.12}
.node.dorm-hl .shape{stroke:var(--warn);stroke-width:2;filter:drop-shadow(0 0 7px rgba(217,130,43,.5))}
.node.flash-once{animation:blink .55s ease-in-out 2}
@keyframes blink{50%{opacity:.25}}

/* tooltip */
#tooltip{position:fixed;z-index:90;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
  padding:8px 11px;max-width:380px;box-shadow:var(--shadow);pointer-events:none;display:none}
#tooltip .tt-route{font:500 10px var(--mono);color:var(--tx-3);margin-bottom:4px}
#tooltip .tt-main{font:500 11.5px var(--mono);color:var(--tx);line-height:1.45;overflow-wrap:break-word}
#tooltip .tt-sub{font:400 10.5px var(--sans);color:var(--tx-2);margin-top:4px;line-height:1.4}

/* ============ Drawer ============ */
#drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:var(--panel-2);
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease-out;
  z-index:45;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{transform:translateX(0)}
.dhead{flex:0 0 auto;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.dhead .drow1{display:flex;align-items:flex-start;gap:10px}
.dhead .dtitle{font:600 15.5px var(--mono);overflow-wrap:anywhere;flex:1}
.dhead .dclose{color:var(--tx-3);font-size:17px;padding:2px 6px;border-radius:3px}
.dhead .dclose:hover{color:var(--tx);background:var(--panel-3)}
.dhead .dlabel{font:400 11px var(--sans);color:var(--tx-2);margin-top:3px;line-height:1.4}
.dhead .dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.dchip{display:inline-flex;align-items:center;gap:5px;font:500 9.5px var(--mono);padding:3px 7px;
  border-radius:3px;border:1px solid var(--line);color:var(--tx-2);background:var(--chip-bg)}
.dchip .sw{width:7px;height:7px;border-radius:2px}
.dchip.warn{color:var(--warn);border-color:rgba(217,130,43,.5)}
.dchip.llm{color:var(--hov);border-color:rgba(240,178,84,.4)}
.dfile{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.dfile .fpath{font:500 10.5px var(--mono);background:var(--chip-bg);border:1px solid var(--line);
  border-radius:3px;padding:4px 7px;color:var(--tx-2);overflow-wrap:anywhere;flex:1;min-width:0}
.dfile button{font:500 10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:4px 8px;color:var(--tx-3)}
.dfile button:hover{color:var(--hov);border-color:var(--hov)}
.dbody{flex:1 1 auto;overflow-y:auto;padding:6px 18px 70px}
.dsec{padding:12px 0 4px;border-bottom:1px solid var(--line-2)}
.dsec:last-child{border-bottom:none}
.dsec h3{font:600 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin-bottom:7px}
.dsec .prose{font:400 12.5px/1.55 var(--sans);color:var(--tx)}
.dsec ul{list-style:none}
.dsec ul li{font:400 12px/1.5 var(--sans);color:var(--tx-2);padding:2px 0 2px 14px;position:relative}
.dsec ul li::before{content:"▸";position:absolute;left:0;color:var(--tx-3);font-size:10px;top:4px}
.dsec ul.fb li::before{color:var(--err)}
.dsec ul.steps li{padding-left:0;margin-bottom:5px}
.dsec ul.steps li::before{content:none}
.dsec ul.steps li{font-size:11.5px;color:var(--tx-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv .k{font:500 10px var(--mono);color:var(--tx-3);padding-top:2px;white-space:nowrap}
.kv .v{font:400 11.5px/1.45 var(--sans);color:var(--tx)}
.kv .v.mono{font:500 10.5px/1.5 var(--mono);color:var(--tx-2)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}
.stag{font:500 10px var(--mono);background:var(--chip-bg);border:1px solid var(--line);border-radius:3px;
  padding:2.5px 7px;color:var(--tx-2)}
.stag.read{border-color:rgba(63,191,174,.45);color:var(--c-graph)}
.stag.write{border-color:rgba(232,163,61,.45);color:var(--c-router)}
.stag.dep{cursor:pointer}
.stag.dep:hover{border-color:var(--hov);color:var(--hov)}
.flagtable{width:100%;border-collapse:collapse}
.flagtable td{font:500 10.5px var(--mono);padding:4px 8px 4px 0;color:var(--tx-2);vertical-align:top;border-bottom:1px solid var(--line-2)}
.flagtable td.fv{color:var(--tx);white-space:nowrap}
.flagtable td.fv .off{color:var(--warn)}
.flagtable td.fn{font:400 10px var(--sans);color:var(--tx-3)}
.regitem{display:flex;gap:9px;padding:4px 0}
.regitem .rtag{font:600 9.5px var(--mono);color:var(--err);white-space:nowrap;padding-top:1px;opacity:.85}
.regitem .rtx{font:400 11.5px/1.45 var(--sans);color:var(--tx-2)}
.callout-no{background:var(--panel-3);border-left:3px solid var(--c-router);border-radius:0 4px 4px 0;
  padding:9px 12px;margin:4px 0}
.callout-no p{font:400 12px/1.55 var(--sans);color:var(--tx);margin-bottom:6px}
.callout-no p:last-child{margin-bottom:0}
.dnav{position:absolute;bottom:0;left:0;right:0;background:var(--panel-2);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 18px}
.dnav span{font:400 10px var(--sans);color:var(--tx-3);flex:1}
.dnav button{border:1px solid var(--line);border-radius:3px;padding:4px 10px;font:500 11px var(--mono);color:var(--tx-2)}
.dnav button:hover{color:var(--hov);border-color:var(--hov)}
.rulestable{width:100%;border-collapse:collapse;margin-top:2px}
.rulestable td{font:400 11px/1.45 var(--sans);color:var(--tx-2);padding:5px 8px 5px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.rulestable td.rn{font:600 10.5px var(--mono);color:var(--c-router);white-space:nowrap}
.rulestable td.rdest{font:500 10px var(--mono);color:var(--c-graph);white-space:nowrap}
.rulestable tr{cursor:pointer}
.rulestable tr:hover td{color:var(--tx)}

/* ============ Transport bar (recorrido) ============ */
#transport{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;
  align-items:center;gap:14px;padding:0 16px;height:54px;z-index:40;position:relative}
#transport select{background:var(--chip-bg);border:1px solid var(--line);border-radius:4px;color:var(--tx);
  font:500 11px var(--mono);padding:6px 8px;outline:none;max-width:420px}
.tbtn{border:1px solid var(--line);border-radius:4px;width:32px;height:30px;font-size:13px;color:var(--tx-2);
  display:inline-flex;align-items:center;justify-content:center;transition:all .14s}
.tbtn:hover{color:var(--hov);border-color:var(--hov)}
.tbtn:disabled{opacity:.3;pointer-events:none}
.tbtn.play{width:40px;color:var(--rec);border-color:rgba(255,148,71,.5)}
#stepCount{font:600 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--tx-2);min-width:86px;text-align:center}
#ticks{display:flex;gap:4px;align-items:center;flex:1;min-width:60px}
#ticks .tick{height:5px;flex:1;max-width:34px;background:var(--line);border-radius:2px;cursor:pointer;transition:background .2s}
#ticks .tick.done{background:var(--rec)}
#ticks .tick.cur{background:var(--sel)}
#speedSel{width:88px}
.tlabel{font:500 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3)}
#scenCard{position:absolute;left:16px;bottom:64px;width:400px;max-width:80vw;background:var(--panel-2);
  border:1px solid var(--line);border-left:3px solid var(--rec);border-radius:4px;box-shadow:var(--shadow);
  padding:12px 15px;z-index:38;display:none}
#scenCard.open{display:block}
#scenCard .sc-step{font:600 9.5px var(--mono);color:var(--rec);letter-spacing:.08em;margin-bottom:4px}
#scenCard .sc-title{font:600 13px var(--sans);margin-bottom:5px}
#scenCard .sc-text{font:400 12px/1.55 var(--sans);color:var(--tx-2)}
#scenCard .sc-crumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
#scenCard .sc-crumbs .cb{font:500 8.5px var(--mono);background:var(--chip-bg);border:1px solid var(--line);
  border-radius:2px;padding:2px 5px;color:var(--tx-3)}
#scenCard .sc-crumbs .cb.cur{color:var(--rec);border-color:var(--rec)}

/* ============ Controles de canvas ============ */
#zctrl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:5px;z-index:30}
#zctrl button{width:32px;height:32px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
  color:var(--tx-2);font:500 15px var(--mono);transition:all .14s}
#zctrl button:hover{color:var(--hov);border-color:var(--hov)}
#zctrl button.small{font-size:10.5px}
#minimap{position:absolute;right:14px;bottom:14px;width:196px;height:104px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:4px;z-index:30;cursor:crosshair;overflow:hidden}
#minimap svg{width:100%;height:100%}
#minimap .vp{fill:rgba(240,178,84,.12);stroke:var(--hov);stroke-width:1.5;cursor:move}
#hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);border-radius:4px;padding:7px 14px;font:400 11px var(--sans);
  color:var(--tx-2);z-index:29;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
#hint b{color:var(--rec);font-weight:600}
#hint button{color:var(--tx-3);font-size:13px}
#hint button:hover{color:var(--tx)}

/* ============ Panel tablero (vista de avión) ============ */
#board{position:absolute;inset:0;background:rgba(5,8,12,.55);z-index:50;display:none;
  align-items:center;justify-content:center;padding:30px}
html[data-theme="light"] #board{background:rgba(40,55,75,.35)}
#board.open{display:flex}
.bwin{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  width:min(1060px,94vw);height:min(680px,88vh);display:flex;flex-direction:column;overflow:hidden}
.bhead{flex:0 0 auto;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 16px;gap:2px}
.bhead .btitle{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);margin-right:18px;padding:14px 0}
.btab{font:500 11px var(--sans);color:var(--tx-3);padding:14px 11px;border-bottom:2px solid transparent;transition:all .14s}
.btab:hover{color:var(--tx)}
.btab.on{color:var(--hov);border-bottom-color:var(--hov)}
.bhead .bclose{margin-left:auto;color:var(--tx-3);font-size:16px;padding:4px 8px}
.bhead .bclose:hover{color:var(--tx)}
.bbody{flex:1 1 auto;overflow-y:auto;padding:18px 22px}
.btable{width:100%;border-collapse:collapse}
.btable th{font:600 9.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--tx-3);
  text-align:left;padding:6px 14px 6px 0;border-bottom:1px solid var(--line)}
.btable td{font:400 11.5px/1.5 var(--sans);color:var(--tx-2);padding:7px 14px 7px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.btable td:first-child{font:500 11px var(--mono);color:var(--tx);white-space:nowrap}
.btable td.mono{font:500 10.5px var(--mono)}
.btable tr.linkable{cursor:pointer}
.btable tr.linkable:hover td{color:var(--tx)}
.bnote{font:400 11px/1.5 var(--sans);color:var(--tx-3);margin:10px 0 16px;padding:9px 12px;
  background:var(--panel-3);border-radius:4px;border-left:3px solid var(--line)}
.bsec-t{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin:18px 0 8px}
.bsec-t:first-child{margin-top:0}
.debtitem{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.debtitem .dn{font:600 12px var(--mono);color:var(--warn);min-width:26px;text-align:right}
.debtitem .dt b{display:block;font:600 12px var(--sans);color:var(--tx);margin-bottom:2px}
.debtitem .dt p{font:400 11.5px/1.5 var(--sans);color:var(--tx-2)}

@media (max-width:1100px){
  .brand{min-width:0}.brand .sub{display:none}
  .counters{display:none}
  .searchbox input{width:160px}
  #drawer{width:88vw}
}
</style>

<header>
  <div class="brand">

    <span class="sicon">⌕</span>
    <input id="search" type="text" placeholder="buscar nodo, archivo, spec…" autocomplete="off" spellcheck="false">
    <div class="sresults" id="sresults"></div>
  </div>
  <button class="hbtn" id="btnBoard">Tablero</button>
  <button class="hbtn" id="btnTheme" title="Alternar tema claro/oscuro">◐ Tema</button>
  <a id="dashLink" class="hbtn" href="/index.html" style="text-decoration:none">← Dashboard</a>
</header>
<div class="fbar">
  <span class="flabel">Tipos</span>
  <span id="typeChips"></span>
  <span class="fsep"></span>
  <button class="fchip special" id="fLLM">✦ solo nodos con LLM</button>
  <button class="fchip special" id="fDorm">⏾ flags dormidos</button>
  <button class="fchip special" id="fDead">⌀ código muerto</button>
  <span class="fsep"></span>
  <button class="fchip special" id="fUsa">⇣ dependencias («usa»)</button>
  <span class="fsep"></span>
  <button class="fchip special" id="fRules">☰ tabla de ruteo</button>
</div>
<div id="main">
  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="zctrl">
    <button id="zIn" title="Acercar">+</button>
    <button id="zOut" title="Alejar">−</button>
    <button id="zFit" class="small" title="Ajustar todo (doble click en el fondo)">⛶</button>
  </div>
  <div id="minimap"><svg id="mmsvg"></svg></div>
  <div id="hint"><span>▶ Probá el <b>modo recorrido</b>: elegí un escenario abajo y mirá cómo viaja una consulta real.</span><button id="hintClose" title="Cerrar">✕</button></div>
  <div id="drawer">
    <div class="dhead" id="dhead"></div>
    <div class="dbody" id="dbody"></div>
    <div class="dnav">
      <button id="dPrev" title="Nodo conectado anterior">←</button>
      <button id="dNext" title="Nodo conectado siguiente">→</button>
      <span>←/→ navegan entre nodos conectados · Esc cierra</span>
    </div>
  </div>
  <div id="scenCard"></div>
  <div id="board">
    <div class="bwin">
      <div class="bhead">
        <span class="btitle">Tablero</span>
        <span id="btabs"></span>
        <button class="bclose" id="boardClose">✕</button>
      </div>
      <div class="bbody" id="bbody"></div>
    </div>
  </div>
</div>
<div id="transport">
  <span class="tlabel">Modo recorrido</span>
  <select id="scenSel"></select>
  <button class="tbtn" id="tFirst" title="Primer paso">⏮</button>
  <button class="tbtn" id="tPrev" title="Paso anterior">◀</button>
  <button class="tbtn play" id="tPlay" title="Reproducir / pausar">▶</button>
  <button class="tbtn" id="tNext" title="Paso siguiente">▶▶</button>
  <span id="stepCount">—</span>
  <div id="ticks"></div>
  <span class="tlabel">Velocidad</span>
  <select id="speedSel">
    <option value="5000">lenta</option>
    <option value="3500" selected>normal</option>
    <option value="2200">rápida</option>
  </select>
  <button class="tbtn" id="tExit" title="Salir del recorrido">✕</button>
</div>

/* ---- helpers de path ---- */
function roundedPath(pts,r=8){
  if(pts.length<2) return '';
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const v1=[x1-x0,y1-y0], v2=[x2-x1,y2-y1];
    const l1=Math.hypot(...v1), l2=Math.hypot(...v2);
    const rr=Math.min(r,l1/2,l2/2);
    if(rr<1){ d+=` L ${x1} ${y1}`; continue; }
    const p1=[x1-v1[0]/l1*rr, y1-v1[1]/l1*rr], p2=[x1+v2[0]/l2*rr, y1+v2[1]/l2*rr];
    d+=` L ${p1[0]} ${p1[1]} Q ${x1} ${y1} ${p2[0]} ${p2[1]}`;
  }
  const last=pts[pts.length-1];
  d+=` L ${last[0]} ${last[1]}`;
  return d;
}

/* ============ pan & zoom ============ */
const wrap = $('#canvasWrap');
let view = {k:1, tx:0, ty:0};
function applyView(animate){
  if(animate){ viewport.style.transition='transform .45s cubic-bezier(.3,.7,.3,1)'; setTimeout(()=>viewport.style.transition='',460); }
  viewport.setAttribute('transform',`translate(${view.tx} ${view.ty}) scale(${view.k})`);
  viewport.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.k})`;
  updateMinimap();
}
function svgPoint(clientX,clientY){
  const r=svg.getBoundingClientRect();
  const sx=(clientX-r.left)*(W/r.width)*(r.width/r.width); // base coords vía viewBox uniform scale
  // viewBox con meet: escala uniforme
  const scale=Math.min(r.width/W,r.height/H);
  const ox=(r.width-W*scale)/2, oy=(r.height-H*scale)/2;
  return [ (clientX-r.left-ox)/scale, (clientY-r.top-oy)/scale ];
}
function zoomAt(cx,cy,factor){
  const nk=Math.min(3.2,Math.max(0.25,view.k*factor));
  const f=nk/view.k;
  view.tx = cx-(cx-view.tx)*f; view.ty = cy-(cy-view.ty)*f; view.k=nk;
  applyView();
}
wrap.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const [px,py]=svgPoint(ev.clientX,ev.clientY);
  zoomAt(px*1+0*view.tx? px:px, py, Math.pow(1.0016,-ev.deltaY));
},{passive:false});
// pan por drag
let panning=null;
wrap.addEventListener('mousedown',ev=>{
  if(ev.button!==0) return;
  if(ev.target.closest('.node')||ev.target.closest('.echip')) return;
  panning={x:ev.clientX,y:ev.clientY,tx:view.tx,ty:view.ty,moved:false};
  wrap.classList.add('panning');
});
window.addEventListener('mousemove',ev=>{
  if(!panning) return;
  const r=svg.getBoundingClientRect();
  const scale=Math.min(r.width/W,r.height/H);
  const dx=(ev.clientX-panning.x)/scale, dy=(ev.clientY-panning.y)/scale;
  if(Math.abs(dx)+Math.abs(dy)>3) panning.moved=true;
  view.tx=panning.tx+dx; view.ty=panning.ty+dy;
  requestAnimationFrame(()=>applyView());
});
window.addEventListener('mouseup',()=>{ panning=null; wrap.classList.remove('panning'); });
function fitAll(animate){
  // margen 3%
  view.k=0.94; view.tx=W*0.03; view.ty=H*0.02; applyView(animate);
}
wrap.addEventListener('dblclick',ev=>{ if(!ev.target.closest('.node')) fitAll(true); });
$('#zIn').onclick=()=>zoomAt(W/2,H/2,1.3);
$('#zOut').onclick=()=>zoomAt(W/2,H/2,1/1.3);
$('#zFit').onclick=()=>fitAll(true);
function panToNode(id,animate=true,zoom){
  const L=LAYOUT[id]; if(!L) return;
  const r=svg.getBoundingClientRect();
  const scale=Math.min(r.width/W,r.height/H);
  const vw=r.width/scale, vh=r.height/scale; // viewport en coords del lienzo a k=1
  const k = zoom || Math.max(view.k, 0.85);
  view.k=k;
  const drawerOpen=$('#drawer').classList.contains('open');
  const cx = vw*(drawerOpen? .34 : .5), cy=vh*.46;
  view.tx = cx - L.x*k; view.ty = cy - L.y*k;
  applyView(animate);
}

function chipRow(items,cls){ return `<div class="tagrow">${items.map(i=>`<span class="stag ${cls||''}">${esc(i)}</span>`).join('')}</div>`; }
function renderFicha(id){
  const n=nodeById[id], f=RAG_DATA.fichas[id], L=DISPLAY[id];

  let chips=`<span class="dchip"><span class="sw" style="background:${col}"></span>${esc(RAG_DATA.node_types[n.type].nombre)}</span>`;

  $('#dhead').innerHTML=`
    <div class="drow1"><div class="dtitle">${esc(L.t)}</div><button class="dclose" id="dclose">✕</button></div>
    <div class="dlabel">${esc(n.label)}</div>
    <div class="dchips">${chips}</div>
    <div class="dfile"><span class="fpath">${esc(n.file)}</span><button id="dcopy">⧉ copiar</button></div>`;
  $('#dclose').onclick=closeDrawer;
  $('#dcopy').onclick=()=>{
    const txt=n.file;
    const done=()=>{ $('#dcopy').textContent='✓ copiado'; setTimeout(()=>$('#dcopy').textContent='⧉ copiar',1400); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
    else fallbackCopy(txt,done);
  };
  function fallbackCopy(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }

  let b='';
  b+=`<div class="dsec"><h3>Qué hace</h3><p class="prose">${esc(f.resumen)}</p></div>`;
  if(f.donde&&f.donde.length) b+=`<div class="dsec"><h3>Dónde</h3>${chipRow(f.donde)}</div>`;
  if(f.llm) b+=`<div class="dsec"><h3>LLM</h3><div class="kv">
      <span class="k">modelo</span><span class="v mono">${esc(f.llm.modelo)}</span>
      ${f.llm.params&&f.llm.params!=='—'?`<span class="k">params</span><span class="v">${esc(f.llm.params)}</span>`:''}
      ${f.llm.timeout&&f.llm.timeout!=='—'?`<span class="k">timeout</span><span class="v mono">${esc(f.llm.timeout)}</span>`:''}
      ${f.llm.prompt&&f.llm.prompt!=='—'?`<span class="k">prompt</span><span class="v mono">${esc(f.llm.prompt)}</span>`:''}
      ${f.llm.nota?`<span class="k">nota</span><span class="v">${esc(f.llm.nota)}</span>`:''}
    </div></div>`;
  if((f.lee&&f.lee.length)||(f.escribe&&f.escribe.length)){
    b+=`<div class="dsec"><h3>State</h3>`;
    if(f.lee&&f.lee.length) b+=`<h3 style="margin-top:2px">lee</h3>${chipRow(f.lee,'read')}`;
    if(f.escribe&&f.escribe.length) b+=`<h3 style="margin-top:8px">escribe</h3>${chipRow(f.escribe,'write')}`;
    b+=`</div>`;
  }
  if(f.depende&&f.depende.length){
    b+=`<div class="dsec"><h3>Depende de</h3><div class="tagrow">${f.depende.map(d=>{
      const target=depTarget(d);
      return `<span class="stag ${target?'dep':''}" ${target?`data-nav="${target}"`:''}>${esc(d)}${target?' ↗':''}</span>`;
    }).join('')}</div></div>`;
  }
  if(f.flags&&f.flags.length){
    b+=`<div class="dsec"><h3>Flags y umbrales</h3><table class="flagtable">${f.flags.map(fl=>{
      const isOff=/false|none|off/i.test(fl.v)&&!/true/i.test(fl.v);
      return `<tr><td>${esc(fl.k)}</td><td class="fv">${isOff?`<span class="off">${esc(fl.v)}</span>`:esc(fl.v)}</td><td class="fn">${esc(fl.nota||'')}</td></tr>`;
    }).join('')}</table></div>`;
  }
  if(f.routing){
    if(id==='router_score_gate'){
      b+=`<div class="dsec"><h3>Reglas de ruteo (orden de precedencia exacto)</h3><table class="rulestable">${RULES_SG.map(r=>
        `<tr data-edge="${r.e}"><td class="rn">${r.n}</td><td>${esc(r.cond)}</td><td class="rdest">→ ${esc(r.dest)}</td></tr>`).join('')}</table></div>`;
      b+=`<div class="dsec"><h3>Lógica que vive en el router</h3><ul class="steps">${f.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
    } else if(id==='router_classify'){
      b+=`<div class="dsec"><h3>Reglas de ruteo</h3><table class="rulestable">${RULES_RC.map(r=>
        `<tr data-edge="${r.e}"><td class="rn">${r.n}</td><td>${esc(r.cond)}</td><td class="rdest">→ ${esc(r.dest)}</td></tr>`).join('')}</table></div>`;
    } else {
      b+=`<div class="dsec"><h3>Routing que emite</h3><p class="prose" style="font-size:11.5px;color:var(--tx-2)">${esc(f.routing)}</p></div>`;
    }
  }
  if(f.pasos&&f.pasos.length&&id!=='router_score_gate'){
    b+=`<div class="dsec"><h3>Pipeline interno (orden exacto)</h3><ul class="steps">${f.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  }
  if(f.fallbacks&&f.fallbacks.length) b+=`<div class="dsec"><h3>Fallbacks</h3><ul class="fb">${f.fallbacks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if(f.regresiones&&f.regresiones.length){
    b+=`<div class="dsec"><h3>Regresiones históricas (spec → bug → fix)</h3>${f.regresiones.map(r=>{
      const i=r.indexOf('—');
      const tag=i>0?r.slice(0,i).trim():r, tx=i>0?r.slice(i+1).trim():'';
      return `<div class="regitem"><span class="rtag">${esc(tag)}</span><span class="rtx">${esc(tx)}</span></div>`;
    }).join('')}</div>`;
  }
  if((f.metricas&&f.metricas.length)||(f.spans&&f.spans.length)){
    b+=`<div class="dsec"><h3>Métricas y spans</h3>`;
    if(f.metricas&&f.metricas.length) b+=chipRow(f.metricas);

    b+=`</div>`;
  }
  if(f.noObvio&&f.noObvio.length){
    b+=`<div class="dsec"><h3>No-obvio</h3><div class="callout-no">${f.noObvio.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`;
  }
  $('#dbody').innerHTML=b;
  $('#dbody').scrollTop=0;
  $$('#dbody [data-nav]').forEach(elm=>elm.onclick=()=>selectNode(elm.dataset.nav));
  $$('#dbody .rulestable tr').forEach(tr=>{
    tr.onmouseenter=()=>{ clearHL(); hlEdge(tr.dataset.edge,true); setDim(true); };
    tr.onmouseleave=()=>{ clearHL(); reapplyScenario(); if(selectedId) nodeEls[selectedId].classList.add('selected'); };
  });
}
function depTarget(dep){
  const dl=dep.toLowerCase();
  let best=null;
  RAG_DATA.nodes.forEach(n=>{
    if(n.id===selectedId) return;
    const t=DISPLAY[n.id].t.toLowerCase();
    if(dl.includes(n.id)||dl.includes(t)||t.includes(dl.split(' ')[0])&&dl.split(' ')[0].length>8) best=best||n.id;
  });
  if(/inputvalidator/.test(dl)) best='validate_input_impl';
  if(/pgvectorstore/.test(dl)) best='pgvector_store';
  if(/permissionresolver/.test(dl)) best='permission_resolver';
  if(/geminiembedding/.test(dl)) best='gemini_embeddings';
  if(/memoryretrieval|memoryservice/.test(dl)) best='memory_service';
  if(/geminireranker/.test(dl)) best='gemini_reranker';
  if(/expand_colloquialisms/.test(dl)) best='colloquialism_normalizer';
  if(/expand_colloquial(?!isms)/.test(dl)) best='colloquial_normalizer';
  if(/classify_meta_subtype|reconstruct_meta_query/.test(dl)) best='meta_query_reconstructor';
  if(/model_routing|tabla model/.test(dl)) best='model_routing';
  if(/citationvalidatingstreamer/.test(dl)) best='citation_streamer';
  if(/pii_detector/.test(dl)) best='guardrail_pii_output';
  return best;
}
function selectNode(id,opts={}){
  if(selectedId&&nodeEls[selectedId]) nodeEls[selectedId].classList.remove('selected');
  selectedId=id;
  nodeEls[id].classList.add('selected');
  renderFicha(id);
  drawer.classList.add('open');
  if(!opts.noPan) panToNode(id,true);
}
function closeDrawer(){
  drawer.classList.remove('open');
  if(selectedId&&nodeEls[selectedId]) nodeEls[selectedId].classList.remove('selected');
  selectedId=null;
}
nodeLayer.addEventListener('click',ev=>{
  const g=ev.target.closest('.node'); if(!g) return;
  if(panning&&panning.moved) return;
  selectNode(g.dataset.id,{noPan:false});
});
$('#dPrev').onclick=()=>cycleNeighbor(-1);
$('#dNext').onclick=()=>cycleNeighbor(1);
function neighbors(id){
  const s=new Set();
  edgesOf[id].out.forEach(e=>s.add(edgeById[e].to));
  edgesOf[id].in.forEach(e=>s.add(edgeById[e].from));
  s.delete(id); return [...s];
}
function cycleNeighbor(dir){
  if(!selectedId) return;
  const ns=neighbors(selectedId); if(!ns.length) return;
  if(!cycleNeighbor.last||cycleNeighbor.base!==selectedId){ cycleNeighbor.idx=dir>0?0:ns.length-1; }
  else cycleNeighbor.idx=(cycleNeighbor.idx+dir+ns.length)%ns.length;
  cycleNeighbor.base=selectedId; cycleNeighbor.last=true;
  selectNode(ns[cycleNeighbor.idx]);
  cycleNeighbor.base=selectedId;
}
window.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT') {
    if(ev.key==='Escape') ev.target.blur();
    return;
  }
  if(ev.key==='Escape'){ if($('#board').classList.contains('open')) $('#board').classList.remove('open');
    else if(scenarioActive) exitScenario(); else closeDrawer(); }
  if(drawer.classList.contains('open')){
    if(ev.key==='ArrowLeft') cycleNeighbor(-1);
    if(ev.key==='ArrowRight') cycleNeighbor(1);
  }
});

const sres=$('#sresults');

$('#search').addEventListener('input',ev=>{

  const terms=q.split(/\s+/);
  sItems=searchIx.filter(x=>terms.every(t=>x.hay.includes(t))).slice(0,12);

  sres.innerHTML=sItems.map((x,i)=>{

    return `<div class="ri${i===sActive?' act':''}" data-id="${x.id}">

      <span class="rid">${esc(DISPLAY[x.id].t)}</span><span class="rl">${esc(n.file)}</span></div>`;
  }).join('')||'<div class="ri"><span class="rl">sin resultados</span></div>';

  if(ev.key==='ArrowDown'){ ev.preventDefault(); sActive=Math.min(sItems.length-1,sActive+1); paintS(); }
  if(ev.key==='ArrowUp'){ ev.preventDefault(); sActive=Math.max(0,sActive-1); paintS(); }
  if(ev.key==='Enter'&&sActive>=0){ gotoSearch(sItems[sActive].id); }
  if(ev.key==='Escape'){ sres.classList.remove('open'); ev.target.blur(); }
});
function paintS(){ $$('#sresults .ri').forEach((e,i)=>e.classList.toggle('act',i===sActive)); }

  setTimeout(()=>nodeEls[id].classList.remove('flash-once'),1200);
}
document.addEventListener('click',ev=>{ if(!ev.target.closest('.searchbox')) sres.classList.remove('open'); });

/* ============ filtros ============ */
const typeState={graph:true,router:true,usecase:true,infra:true,helper:true,dead:true};
const fState={llm:false,dorm:false,dead:false};
(function buildTypeChips(){
  const c=$('#typeChips');
  c.innerHTML=Object.keys(typeState).map(t=>
    `<button class="fchip" data-type="${t}"><span class="sw" style="background:${TYPE_HEX[t]}"></span>${RAG_DATA.node_types[t].nombre}</button>`).join(' ');
  $$('#typeChips .fchip').forEach(b=>b.onclick=()=>{
    typeState[b.dataset.type]=!typeState[b.dataset.type];
    b.classList.toggle('off',!typeState[b.dataset.type]);
    applyFilters();
  });
})();
$('#fLLM').onclick=function(){ fState.llm=!fState.llm; this.classList.toggle('on',fState.llm); applyFilters(); };
$('#fDorm').onclick=function(){ fState.dorm=!fState.dorm; this.classList.toggle('on',fState.dorm); applyFilters(); };
$('#fDead').onclick=function(){ fState.dead=!fState.dead; this.classList.toggle('on',fState.dead); applyFilters(); };
let usaShown=false;
$('#fUsa').onclick=function(){ usaShown=!usaShown; this.classList.toggle('on',usaShown); svg.classList.toggle('usa-hidden',!usaShown); };
function nodeVisible(n){
  if(!typeState[n.type]) return false;
  if(fState.llm && !n.llm) return false;
  if(fState.dead && n.type!=='dead') return false;
  return true;
}
function applyFilters(){
  RAG_DATA.nodes.forEach(n=>{
    const vis=nodeVisible(n);
    nodeEls[n.id].classList.toggle('fdim',!vis);
    nodeEls[n.id].classList.toggle('dorm-hl', fState.dorm && (n.dormant||[]).length>0 && vis);
    if(fState.dorm && !(n.dormant||[]).length) nodeEls[n.id].classList.add('fdim');
  });
  RAG_DATA.edges.forEach(e=>{
    const dim = nodeEls[e.from].classList.contains('fdim')||nodeEls[e.to].classList.contains('fdim');
    edgeEls[e.id].classList.toggle('fdim',dim);
    (chipEls[e.id]||[]).forEach(c=>c.classList.toggle('fdim',dim));
  });
}

/* ============ tabla de ruteo flotante ============ */
const styleX=document.createElement('style');
styleX.textContent=`#rulesPanel{position:absolute;left:14px;bottom:14px;width:470px;max-height:46vh;overflow-y:auto;
  background:var(--panel-2);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);z-index:31;display:none;padding:10px 14px}
#rulesPanel.open{display:block}
#rulesPanel h4{font:600 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin:8px 0 4px}`;
document.head.appendChild(styleX);
const rp=hel('div','', $('#main')); rp.id='rulesPanel';
rp.innerHTML=`<h4>_route_after_score_gate — precedencia 1→8</h4>
  <table class="rulestable">${RULES_SG.map(r=>`<tr data-edge="${r.e}"><td class="rn">${r.n}</td><td>${esc(r.cond)}</td><td class="rdest">→ ${esc(r.dest)}</td></tr>`).join('')}</table>
  <h4>_route_after_classify — por intent</h4>
  <table class="rulestable">${RULES_RC.map(r=>`<tr data-edge="${r.e}"><td class="rn">·</td><td>${esc(r.cond)}</td><td class="rdest">→ ${esc(r.dest)}</td></tr>`).join('')}</table>`;
$('#fRules').onclick=function(){ rp.classList.toggle('open'); this.classList.toggle('on'); };
$$('#rulesPanel tr').forEach(tr=>{
  tr.onmouseenter=()=>{ if(scenarioActive)return; clearHL(); hlEdge(tr.dataset.edge,true); setDim(true); };
  tr.onmouseleave=()=>{ if(scenarioActive)return; clearHL(); };
  tr.onclick=()=>{ const e=edgeById[tr.dataset.edge]; selectNode(e.to); };
});

/* ============ minimapa ============ */
const mm=$('#mmsvg'); mm.setAttribute('viewBox',`0 0 ${W} ${H}`);
RAG_DATA.nodes.forEach(n=>{
  const L=LAYOUT[n.id];
  el('rect',{x:L.x-L.w/2,y:L.y-L.h/2,width:L.w,height:L.h,fill:TYPE_HEX[n.type],'fill-opacity':n.type==='dead'?.3:.75},mm);
});
const mmVp=el('rect',{'class':'vp',x:0,y:0,width:W,height:H},mm);
function updateMinimap(){
  const r=svg.getBoundingClientRect();
  const scale=Math.min(r.width/W,r.height/H);
  const vw=r.width/(scale*view.k), vh=r.height/(scale*view.k);
  const ox=(r.width-W*scale)/2/(scale*view.k), oy=(r.height-H*scale)/2/(scale*view.k);
  mmVp.setAttribute('x',-view.tx/view.k - ox + 0);
  mmVp.setAttribute('y',-view.ty/view.k - oy);
  mmVp.setAttribute('width',vw); mmVp.setAttribute('height',vh);
}
let mmDrag=false;
$('#minimap').addEventListener('mousedown',ev=>{ mmDrag=true; mmMove(ev); });
window.addEventListener('mousemove',ev=>{ if(mmDrag) mmMove(ev); });
window.addEventListener('mouseup',()=>mmDrag=false);
function mmMove(ev){
  const r=$('#minimap').getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*W, py=(ev.clientY-r.top)/r.height*H;
  const sr=svg.getBoundingClientRect();
  const scale=Math.min(sr.width/W,sr.height/H);
  view.tx = sr.width/2/scale - px*view.k; view.ty = sr.height/2/scale - py*view.k;
  applyView();
}
window.addEventListener('resize',updateMinimap);

/* ============ modo recorrido ============ */
const scenSel=$('#scenSel');
RAG_DATA.scenarios.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s.nombre; scenSel.appendChild(o); });
let scen=null, stepIdx=0, playing=false, playTimer=null;
function enterScenario(i){
  scen=RAG_DATA.scenarios[i]; stepIdx=0; scenarioActive=true;
  wrap.classList.add('scenario-on');
  $('#hint').style.display='none';
  closeDrawer(); rp.classList.remove('open'); $('#fRules').classList.remove('on');
  buildTicks(); renderStep(); setDim(true);
}
function exitScenario(){
  scenarioActive=false; playing=false; clearTimeout(playTimer);
  wrap.classList.remove('scenario-on');
  $('#scenCard').classList.remove('open');
  $$('.rec,.rec-cur',svg).forEach(e=>e.classList.remove('rec','rec-cur'));
  $$('.edge .full',svg).forEach(p=>p.style.opacity='0');
  setDim(false);
  $('#tPlay').textContent='▶';
  $('#stepCount').textContent='—';
  $('#ticks').innerHTML='';
}
function reapplyScenario(){ if(scenarioActive){ paintTrail(); setDim(true); } }
function buildTicks(){
  const t=$('#ticks');
  t.innerHTML=scen.pasos.map((_,i)=>`<div class="tick" data-i="${i}"></div>`).join('');
  $$('#ticks .tick').forEach(tk=>tk.onclick=()=>{ stepIdx=+tk.dataset.i; pause(); renderStep(); });
}
function paintTrail(){
  $$('.rec,.rec-cur',svg).forEach(e=>e.classList.remove('rec','rec-cur'));
  $$('.edge .full',svg).forEach(p=>p.style.opacity='0');
  for(let i=0;i<=stepIdx;i++){
    const p=scen.pasos[i];
    if(p.node&&nodeEls[p.node]) nodeEls[p.node].classList.add('rec');
    if(p.edge&&edgeEls[p.edge]){
      edgeEls[p.edge].classList.add('rec');
      const full=edgeEls[p.edge].querySelector('.full'); if(full) full.style.opacity='1';
      edgeEls[p.edge].querySelectorAll('.main').forEach(m=>{ if(m.style.opacity==='0') m.style.opacity='1'; });
      (chipEls[p.edge]||[]).forEach(c=>c.classList.add('rec'));
    }
  }
  const cur=scen.pasos[stepIdx];
  if(cur.node&&nodeEls[cur.node]) nodeEls[cur.node].classList.add('rec-cur');
  if(cur.edge&&edgeEls[cur.edge]) edgeEls[cur.edge].classList.add('rec-cur');
}
function renderStep(){
  paintTrail();
  const cur=scen.pasos[stepIdx];
  $('#stepCount').textContent=`PASO ${stepIdx+1}/${scen.pasos.length}`;
  $$('#ticks .tick').forEach((tk,i)=>{ tk.classList.toggle('done',i<stepIdx); tk.classList.toggle('cur',i===stepIdx); });
  const card=$('#scenCard');
  card.innerHTML=`<div class="sc-step">PASO ${stepIdx+1} / ${scen.pasos.length} · ${esc(scen.nombre)}</div>
    <div class="sc-title">${esc(cur.titulo)}</div>
    <div class="sc-text">${esc(cur.texto)}</div>
    <div class="sc-crumbs">${scen.pasos.slice(0,stepIdx+1).map((p,i)=>
      `<span class="cb${i===stepIdx?' cur':''}">${esc(p.node?DISPLAY[p.node].t.split(' ')[0]:'·')}</span>`).join('')}</div>`;
  card.classList.add('open');
  if(cur.node) panToNode(cur.node,true);
}
function step(dir){
  const n=stepIdx+dir;
  if(n<0) return;
  if(n>=scen.pasos.length){ pause(); return; }
  stepIdx=n; renderStep();
}
function play(){
  if(!scenarioActive) enterScenario(+scenSel.value);
  playing=true; $('#tPlay').textContent='⏸';
  schedule();
}
function schedule(){
  clearTimeout(playTimer);
  if(!playing) return;
  playTimer=setTimeout(()=>{
    if(stepIdx>=scen.pasos.length-1){ pause(); return; }
    stepIdx++; renderStep(); schedule();
  },+$('#speedSel').value);
}
function pause(){ playing=false; clearTimeout(playTimer); $('#tPlay').textContent='▶'; }
$('#tPlay').onclick=()=>{ playing?pause():play(); };
$('#tNext').onclick=()=>{ if(!scenarioActive) enterScenario(+scenSel.value); else step(1); pause(); };
$('#tPrev').onclick=()=>{ if(scenarioActive){ step(-1); pause(); } };
$('#tFirst').onclick=()=>{ if(!scenarioActive) enterScenario(+scenSel.value); stepIdx=0; pause(); renderStep(); };
$('#tExit').onclick=exitScenario;
scenSel.onchange=()=>{ if(scenarioActive){ exitScenario(); enterScenario(+scenSel.value); } };
$('#hintClose').onclick=()=>$('#hint').style.display='none';

/* ============ tablero (vista de avión) ============ */
const TABS=[
  ['lat','Latencias'],['deuda','Deuda técnica'],['state','RAGState'],['settings','Settings'],
  ['prompts','Prompts'],['specs','Specs'],['sse','SSE'],['soporte','Soporte']
];
let curTab='lat';
$('#btabs').innerHTML=TABS.map(t=>`<button class="btab" data-t="${t[0]}">${t[1]}</button>`).join('');
$$('#btabs .btab').forEach(b=>b.onclick=()=>{ curTab=b.dataset.t; renderBoard(); });
$('#btnBoard').onclick=()=>{ $('#board').classList.add('open'); renderBoard(); };
$('#boardClose').onclick=()=>$('#board').classList.remove('open');
$('#board').addEventListener('click',ev=>{ if(ev.target.id==='board') $('#board').classList.remove('open'); });
function renderBoard(){
  $$('#btabs .btab').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));
  const b=$('#bbody');
  if(curTab==='lat'){
    b.innerHTML=`<div class="bnote">Latencias conocidas, de comentarios y mediciones en el código (sección H de la KB).</div>
    <table class="btable"><tr><th>Componente</th><th>Latencia</th><th>Fuente</th></tr>
    ${RAG_DATA.latencias.map(l=>`<tr><td>${esc(l[0])}</td><td class="mono">${esc(l[1])}</td><td class="mono">${esc(l[2])}</td></tr>`).join('')}</table>`;
  } else if(curTab==='deuda'){
    b.innerHTML=`<div class="bnote">Deuda técnica y riesgos relevados (sección I) — insumo del plan de mejora.</div>`+
      RAG_DATA.deuda.map((d,i)=>`<div class="debtitem"><span class="dn">${i+1}</span><span class="dt"><b>${esc(d[0])}</b><p>${esc(d[1])}</p></span></div>`).join('');
  } else if(curTab==='state'){
    b.innerHTML=`<div class="bnote">RAGState: quién escribe cada campo, quién lo consume y si persiste entre turnos vía checkpointer (sección E).</div>
    <table class="btable"><tr><th>Campo</th><th>Lo escribe</th><th>Lo consume</th><th>Persiste</th></tr>
    ${RAG_DATA.state_map.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="mono">${esc(r[3])}</td></tr>`).join('')}</table>`;
  } else if(curTab==='settings'){
    b.innerHTML=`<div class="bnote">Defaults verificados en src/config/settings.py (sección F). El modelo efectivo por nodo LLM lo define la tabla model_routing en runtime.</div>
    <table class="btable"><tr><th>Setting</th><th>Default</th><th>Línea</th><th>Consumidor</th></tr>
    ${RAG_DATA.settings.map(s=>`<tr><td>${esc(s[0])}</td><td class="mono">${esc(s[1])}</td><td class="mono">${esc(s[2])}</td><td>${esc(s[3])}</td></tr>`).join('')}</table>
    <div class="bsec-t">Constantes hardcodeadas relevantes (no settings)</div>
    <div class="bnote" style="border-left-color:var(--warn)">${esc(RAG_DATA.constantes)}</div>`;
  } else if(curTab==='prompts'){
    const P=RAG_DATA.prompts;
    b.innerHTML=['tier1','tier3','templates'].map(k=>`<div class="bsec-t">${esc(P[k].titulo)}</div>
      <table class="btable">${P[k].items.map(i=>`<tr><td>${esc(i)}</td></tr>`).join('')}</table>
      ${P[k].nota?`<div class="bnote">${esc(P[k].nota)}</div>`:''}`).join('');
  } else if(curTab==='specs'){
    b.innerHTML=`<div class="bnote">Glosario de specs citadas en el código (sección J) — la bibliografía del pipeline.</div>
    <table class="btable"><tr><th>Spec</th><th>Qué introdujo</th><th>Dónde pega</th></tr>
    ${RAG_DATA.specs.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[2])}</td></tr>`).join('')}</table>`;
  } else if(curTab==='sse'){
    b.innerHTML=`<div class="bnote">Contrato SSE del endpoint de chat.</div>
    <table class="btable"><tr><th>Evento</th><th>Payload</th><th>Cuándo</th></tr>
    ${RAG_DATA.sse_events.map(s=>`<tr><td>${esc(s.event)}</td><td class="mono">${esc(s.payload)}</td><td>${esc(s.cuando)}</td></tr>`).join('')}</table>`;
  } else if(curTab==='soporte'){
    b.innerHTML=`<div class="bnote">Infraestructura de soporte sin nodo propio en el grafo (sección D.13).</div>`+
      RAG_DATA.soporte_extra.map(s=>`<div class="bsec-t">${esc(s.titulo)} <span style="text-transform:none;letter-spacing:0;color:var(--tx-3)">· ${esc(s.file)}</span></div>
      <p style="font:400 12px/1.6 var(--sans);color:var(--tx-2);margin-bottom:6px">${esc(s.texto)}</p>`).join('');
  }
}
